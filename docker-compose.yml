name: docnotes-backend

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-models:
    image: ollama/ollama:latest
    entrypoint: ["sh", "-c", "ollama pull \"$$LLM_MODEL\" && ollama pull \"$$EMBEDDING_MODEL\""]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      DATA_DIR: /data
    volumes:
      - ./app:/app/app
      - data:/data
    ports:
      - "8000:8000"
    depends_on:
      ollama-models:
        condition: service_completed_successfully

volumes:
  ollama:
  data:
